[project]
name = "scaffold-demo"
version = "0.1.0"
description = "从 nanobot 提取的通用脚手架模式演示项目"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "pydantic>=2.0.0",
    "loguru>=0.7.0",
    "httpx>=0.27.0",
]

[project.scripts]
scaffold = "scaffold.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["scaffold"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
